<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المشوار | خدمات</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><div class="hero"><h1>📍 متابعة المشوار</h1><p class="muted">آخر موقع متاح للمشوار.</p></div><div id="share" class="card">جارٍ التحميل...</div></main><script type="module">const e=document.getElementById('share'),t=new URLSearchParams(location.search).get('token');async function load(){try{const r=await fetch('/api/v1/shared-trips/'+encodeURIComponent(t||'')),j=await r.json();if(!r.ok)throw Error(j?.error?.message||'الرابط غير صالح');e.innerHTML='<h2>'+j.code+'</h2><p>الحالة: <b>'+j.status+'</b></p>'+(j.provider?'<p>مقدم الخدمة: '+j.provider.displayName+(j.provider.verified?' ✓':'')+'</p>':'')+(j.location?'<p>آخر تحديث: '+new Date(j.location.updatedAt).toLocaleString('ar-YE')+'</p><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+j.location.lat+','+j.location.lng+'">فتح الموقع</a>':'<p class="muted">لا يوجد موقع حي متاح الآن.</p>')}catch(x){e.innerHTML='<p class="error">'+String(x.message||x)+'</p>'}}load();setInterval(load,10000);</script></body></html>
