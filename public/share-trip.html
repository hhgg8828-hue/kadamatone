<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المشوار | خدمات</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><div class="hero"><h1>📍 متابعة المشوار</h1><p class="muted">المسار والموقع المباشر للمشوار.</p></div><div id="share" class="card">جارٍ التحميل...</div></main><script type="module">
const e=document.getElementById('share'),t=new URLSearchParams(location.search).get('token');let map=null,path=null,marker=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function ensureMap(){if(window.L)return window.L;return await new Promise((resolve,reject)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>resolve(window.L);s.onerror=reject;document.body.appendChild(s);});}
async function load(){try{const r=await fetch('/api/v1/shared-trips/'+encodeURIComponent(t||''));const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'الرابط غير صالح');const h=Array.isArray(j.history)?j.history:[],pts=h.map(x=>[Number(x.lat),Number(x.lng)]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1]));if(j.location)pts.push([Number(j.location.lat),Number(j.location.lng)]);const unique=pts.filter((p,i,a)=>i===0||p[0]!==a[i-1][0]||p[1]!==a[i-1][1]);e.innerHTML='<h2>'+esc(j.code)+'</h2><p>الحالة: <b>'+esc(j.status)+'</b></p>'+(j.provider?'<p>مقدم الخدمة: '+esc(j.provider.displayName)+(j.provider.verified?' ✓':'')+'</p>':'')+'<div id="sharedMap" style="height:360px;border-radius:12px;overflow:hidden;margin-top:12px"></div>'+(j.location?'<p class="muted">آخر تحديث: '+new Date(j.location.updatedAt).toLocaleString('ar-YE')+' · GPS حي</p>':'<p class="muted">بانتظار موقع GPS حي.</p>');const L=await ensureMap(),el=document.getElementById('sharedMap');if(!map){map=L.map(el,{scrollWheelZoom:false}).setView(unique[unique.length-1]||[15.55,48.52],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);path=L.polyline(unique,{weight:6,opacity:.85}).addTo(map);marker=unique.length?L.marker(unique[unique.length-1]).addTo(map):null;}else{path.setLatLngs(unique);if(j.location&&marker)marker.setLatLng([j.location.lat,j.location.lng]);}if(unique.length>1)map.fitBounds(path.getBounds(),{padding:[24,24]});setTimeout(()=>map.invalidateSize(),100);}catch(x){e.innerHTML='<p class="error">'+esc(x.message||x)+'</p>';}}
load();setInterval(load,8000);
</script></body></html>
